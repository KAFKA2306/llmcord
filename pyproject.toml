[project]
name = "llmcord"
version = "0.1.0"
description = "Discord frontend for OpenAI-compatible local and remote LLM APIs"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "discord.py==2.7.1",
  "httpx==0.28.1",
  "openai==3.6.0",
  "python-dotenv==1.2.3",
  "pyyaml==6.0.3",
]

[tool.uv]
package = false
required-version = ">=0.12.7,<0.13"
