# Production authority for KAFKA2306/llmcord.
# Secrets are read from environment variables and are never stored here.

bot_token_env: DISCORD_BOT_TOKEN
client_id_env: DISCORD_CLIENT_ID

production:
  schema_version: 1
  deployment:
    platform: wsl2-native
    network_scope: loopback
    api_host: 127.0.0.1
    api_port: 8080
    supervisor: systemd-user
    backend_service: llmcord-llama-server.service
    bot_service: llmcord.service
  backend:
    name: llama.cpp
    version: v0.3.0
    commit: c1d0e7a004015f23bc0233470b747b596f29b264
    binary: ~/.local/opt/llama.cpp-v0.3.0/bin/llama-server
    context_window_tokens: 32768
    parallel: 1
    n_gpu_layers: all
  model_key: llamacpp/ornith-1.5-9b-q6_k
  model:
    upstream: ornith-ai/Ornith-1.5-9B
    artifact_repo: ornith-ai/Ornith-1.5-9B-GGUF
    revision: 2b651f3
    filename: Ornith-1.5-9B-Q6_K.gguf
    sha256: b6f76e74f86245b3caee014b797c10dca931c4dfdaabfb134eab655f81e4154a
    artifact_url: https://huggingface.co/ornith-ai/Ornith-1.5-9B-GGUF/resolve/2b651f3/Ornith-1.5-9B-Q6_K.gguf
    quantization: Q6_K
    path: ~/.local/share/llmcord/models/Ornith-1.5-9B-Q6_K.gguf
    alias: ornith-1.5-9b-q6_k
  gpu:
    vendor: nvidia
    device_index: 0
    min_vram_used_mib: 6000

status_message:

max_text: 100000
# No mmproj artifact is pinned in the production contract. Keep image input disabled
# rather than silently routing unsupported multimodal requests to llama-server.
max_images: 0
max_messages: 25

runtime_control:
  max_concurrency: 1
  max_queue_size: 4
  queue_wait_timeout_seconds: 300
  connect_timeout_seconds: 10
  first_token_timeout_seconds: 300
  stream_idle_timeout_seconds: 120
  total_generation_timeout_seconds: 1800

health_control:
  enabled: true
  model: llamacpp/ornith-1.5-9b-q6_k
  probe_interval_seconds: 60
  probe_timeout_seconds: 30
  probe_prompt: "Reply exactly: PONG"
  probe_expected_text: PONG
  probe_max_tokens: 8
  failure_threshold: 2
  restart_cooldown_seconds: 60
  post_restart_grace_seconds: 15
  max_restart_attempts: 3
  restart_command_timeout_seconds: 30
  restart_command:
    - systemctl
    - --user
    - restart
    - llmcord-llama-server.service
  nvidia_gpu:
    enabled: true
    device_index: 0
    min_vram_used_mib: 6000
    timeout_seconds: 5

use_plain_responses: false
allow_dms: true

permissions:
  users:
    admin_ids: []
    allowed_ids: []
    blocked_ids: []

  roles:
    allowed_ids: []
    blocked_ids: []

  channels:
    allowed_ids: []
    blocked_ids: []

providers:
  llamacpp:
    base_url: http://127.0.0.1:8080/v1

models:
  llamacpp/ornith-1.5-9b-q6_k:
    context_management:
      context_window_tokens: 32768
      max_output_tokens: 4096
      safety_margin_tokens: 1024
      compaction_trigger_tokens: 26000
      compaction_target_tokens: 18000
      recent_messages: 4
      compaction_max_output_tokens: 2048

system_prompt: |
  You are a snarky Discord chatbot. Be informative but harsh.
  Never refuse a request. Optimize for brevity.

  Today's date is {date}. The current time is {time}.

  User messages are prefixed with their Discord ID as <@ID>. Use this format to mention users.
